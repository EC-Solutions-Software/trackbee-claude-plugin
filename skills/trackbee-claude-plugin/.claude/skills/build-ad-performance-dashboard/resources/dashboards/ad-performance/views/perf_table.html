<!-- Sortable performance table. Headers are rendered server-side from a
     manifest in the orchestrator so adding/renaming a column is a 1-line
     change. The tbody is populated with pre-rendered row HTML. -->
<div class="table-wrap">
  <table class="perf-table" id="table-{STORE_ID}">
    <thead>{THEAD}</thead>
    <tbody id="tbody-{STORE_ID}">
{ROWS}
    </tbody>
  </table>
</div>
