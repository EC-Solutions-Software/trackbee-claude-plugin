<!-- Plain-language card surfaced when an input file or whole section is
     missing. Title, body and fix instructions all come from the issue
     object emitted by transforms/_io.py or one of the section guards in
     the orchestrator. -->
<div class="miss-card">
  <div class="miss-title">{TITLE}</div>
  <div class="miss-body">{BODY}</div>
  <div class="miss-fix">{FIX}</div>
</div>
