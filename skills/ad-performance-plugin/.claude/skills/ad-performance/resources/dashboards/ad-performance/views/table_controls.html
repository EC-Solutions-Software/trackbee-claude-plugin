<!-- Controls strip: platform tabs, zero-spend toggle, name search. -->
<div class="table-controls">
  <div class="plat-tabs">
    <button class="plat-tab active" data-plat="all"    onclick="filterPlatform(this,'all',  {STORE_ID})">All Platforms</button>
    <button class="plat-tab"        data-plat="meta"   onclick="filterPlatform(this,'meta', {STORE_ID})">Meta</button>
    <button class="plat-tab"        data-plat="google" onclick="filterPlatform(this,'google',{STORE_ID})">Google</button>
  </div>
  <div class="status-filter">
    <label><input type="checkbox" id="hide-zero-{STORE_ID}" onchange="toggleZero({STORE_ID})" checked> Hide zero-spend</label>
    <input type="text" class="search-box" id="search-{STORE_ID}" placeholder="Filter by name…" oninput="filterSearch({STORE_ID})">
  </div>
</div>
