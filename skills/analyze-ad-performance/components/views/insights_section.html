<!-- Two-column grid: Meta key observations / Google key observations.
     Lists are pre-rendered <li> strings of measured figures. -->
<div class="insights-grid">
  <div class="insights-card">
    <div class="ins-header"><span class="plat-badge meta">Meta</span> Key observations</div>
    <ul class="ins-list">{META_INSIGHTS}</ul>
  </div>
  <div class="insights-card">
    <div class="ins-header"><span class="plat-badge google">Google</span> Key observations</div>
    <ul class="ins-list">{GOOGLE_INSIGHTS}</ul>
  </div>
</div>
