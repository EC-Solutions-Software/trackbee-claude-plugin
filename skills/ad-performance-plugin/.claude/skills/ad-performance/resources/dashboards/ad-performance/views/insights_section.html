<!-- Two-column insights / recommendations cards (Meta · Google). -->
<div class="section-heading" style="margin-top:32px">Performance Analysis</div>
<div class="insights-grid">
  <div class="insights-card">
    <div class="ins-header"><span class="plat-badge meta">Meta</span> Key Insights</div>
    <ul class="ins-list">{META_INSIGHTS_LI}</ul>
    <div class="ins-header" style="margin-top:14px">Recommendations</div>
    <ul class="ins-list recs">{META_RECS_LI}</ul>
  </div>
  <div class="insights-card">
    <div class="ins-header"><span class="plat-badge google">Google</span> Key Insights</div>
    <ul class="ins-list">{GOOG_INSIGHTS_LI}</ul>
    <div class="ins-header" style="margin-top:14px">Recommendations</div>
    <ul class="ins-list recs">{GOOG_RECS_LI}</ul>
  </div>
</div>
