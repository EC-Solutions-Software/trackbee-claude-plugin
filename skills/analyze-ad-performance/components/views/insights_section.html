<!-- Two-column grid: Meta key insights / Google key insights. Each column also
     carries a Recommendations sub-list. Lists are pre-rendered <li> strings. -->
<div class="insights-grid">
  <div class="insights-card">
    <div class="ins-header"><span class="plat-badge meta">Meta</span> Key Insights</div>
    <ul class="ins-list">{META_INSIGHTS}</ul>
    <div class="ins-header" style="margin-top:14px">Recommendations</div>
    <ul class="ins-list recs">{META_RECS}</ul>
  </div>
  <div class="insights-card">
    <div class="ins-header"><span class="plat-badge google">Google</span> Key Insights</div>
    <ul class="ins-list">{GOOGLE_INSIGHTS}</ul>
    <div class="ins-header" style="margin-top:14px">Recommendations</div>
    <ul class="ins-list recs">{GOOGLE_RECS}</ul>
  </div>
</div>
