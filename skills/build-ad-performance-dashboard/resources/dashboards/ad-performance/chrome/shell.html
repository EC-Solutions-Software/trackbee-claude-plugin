<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Performance Dashboard — TrackBee</title>
<style>{INLINE_THEME_CSS}</style>
</head>
<body>

<!-- TB_DATA + format helpers must load before any slot script runs. Slot
     scripts read window.TB_DATA / window.TB.fmt at parse time. -->
<script>window.TB_DATA = {INLINE_TB_DATA_JSON};</script>
<script>{INLINE_FORMAT_HELPERS_JS}</script>

<header class="page-header">
  {LOGO_HTML}
  <span class="header-divider"></span>
  <span class="report-title">Ad Performance Dashboard</span>
  <span class="header-spacer"></span>
  <span class="date-pill">{DATE_PILL}</span>
  <span class="generated">Generated {GENERATED_AT}</span>
</header>

{GLOBAL_ALERTS}

<nav class="store-nav" id="storeNav">{NAV_TABS}</nav>

<main class="main">
{STORE_SECTIONS}
</main>

{SLOT_FOOTER}

<script>{INLINE_APP_JS}</script>
</body>
</html>
